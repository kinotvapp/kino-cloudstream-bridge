# GPL-3.0 (this fork). Kino bridge CI: script tests, :bridge:check (unit tests, symbol oracle, lint), the debug APK and an UNSIGNED
# release APK with its plugin-ABI check (verifyPluginAbiRelease), on every push and pull request.
# Nothing is published or uploaded as an APK from here, and no secret is read: a release is signed and published by a
# person on the Mac (BRIDGE.md "Build"), with :bridge:assembleRelease, which runs verifyPluginAbiRelease first.
name: Kino bridge CI

on:
  push:
    branches: [kino-bridge]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kino-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Script tests (symbol oracle, upstream bump)
        run: |
          python3 scripts/test_symbol_coverage.py
          python3 scripts/test_upstream_bump.py

      - name: Unit tests, symbol oracle and lint
        run: ./gradlew :bridge:check

      - name: Debug APK
        run: ./gradlew :bridge:assembleDebug

      - name: Unsigned release APK and its plugin-ABI check
        run: ./gradlew :bridge:verifyPluginAbiRelease :bridge:assembleRelease

      - name: Test and check reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bridge-reports
          path: |
            bridge/build/reports/
            bridge/build/test-results/
            bridge/build/verifyPluginAbi/
            bridge/build/verifyReplacedClasses/
          if-no-files-found: ignore
